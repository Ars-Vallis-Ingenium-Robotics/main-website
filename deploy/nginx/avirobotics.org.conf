# Production: avirobotics.org (+ www -> apex). Proxies to avi-site-prod on 127.0.0.1:5080.
# Cert (same webroot pattern as sms/testing), once DNS points here:
#   certbot certonly --webroot -w /home/hermes_990-005/letsencrypt-webroots/avirobotics.org \
#     -d avirobotics.org -d www.avirobotics.org --config-dir /home/hermes_990-005/letsencrypt ...
# SMS lives in sms.avirobotics.org.conf.

server {
    listen 80;
    listen [::]:80;
    server_name avirobotics.org www.avirobotics.org;

    location ^~ /.well-known/acme-challenge/ {
        alias /home/hermes_990-005/letsencrypt-webroots/avirobotics.org/.well-known/acme-challenge/;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://avirobotics.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.avirobotics.org;

    ssl_certificate /home/hermes_990-005/letsencrypt/live/avirobotics.org/fullchain.pem;
    ssl_certificate_key /home/hermes_990-005/letsencrypt/live/avirobotics.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://avirobotics.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avirobotics.org;

    ssl_certificate /home/hermes_990-005/letsencrypt/live/avirobotics.org/fullchain.pem;
    ssl_certificate_key /home/hermes_990-005/letsencrypt/live/avirobotics.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
