# /etc/nginx/sites-available/avirobotics.org  (symlink into sites-enabled)
# TLS via certbot:  sudo certbot --nginx -d avirobotics.org -d www.avirobotics.org
# Mirrors how SecWeb is proxied; this app listens on 127.0.0.1:5080.

server {
    listen 80;
    listen [::]:80;
    server_name avirobotics.org www.avirobotics.org;
    return 301 https://avirobotics.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.avirobotics.org;
    # ssl_certificate lines are added by certbot
    return 301 https://avirobotics.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name avirobotics.org;
    # ssl_certificate lines are added by certbot

    client_max_body_size 1m;   # no uploads on the public site
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Sequoia Marine Solutions microsite: same app, host-based routing (SmsSite:Host).
#   sudo certbot --nginx -d sms.avirobotics.org
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sms.avirobotics.org;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
