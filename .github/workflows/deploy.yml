name: Deploy to Linode

# Manual until we trust it. Flip to `on: push: branches: [main]` later.
on:
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet publish src/AviSite.Web -c Release -o publish
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload (App_Data is never touched)
        run: rsync -az --delete --exclude 'App_Data/' publish/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/avisite/app/"
      - name: Restart + health check
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo systemctl restart avisite && sleep 3 && curl -sf http://127.0.0.1:5080/healthz'
