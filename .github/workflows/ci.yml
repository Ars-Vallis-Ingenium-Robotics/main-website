name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/AviSite.Web -c Release
      - name: Start app (Development, fake PayPal)
        run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5080 \
            nohup dotnet run --project src/AviSite.Web -c Release --no-build --no-launch-profile > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5080/healthz && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: E2E smoke tests
        working-directory: tests/e2e
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node smoke.mjs
      - if: failure()
        run: cat app.log

  deploy-staging:
    name: Deploy site-v2 staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/site-v2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: site-v2-staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/site-v2-deploy"
          chmod 0600 "$HOME/.ssh/site-v2-deploy"
          install -m 0644 deploy/staging_known_hosts "$HOME/.ssh/known_hosts"
      - name: Deploy tested commit
        run: >-
          ssh -i "$HOME/.ssh/site-v2-deploy"
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ConnectTimeout=15
          hermes_990-005@sms.avirobotics.org
          "deploy-site-v2 $GITHUB_SHA"
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://testing.voss.industries/healthz
          curl --fail --silent --show-error https://testing.voss.industries/sms | grep -q 'Sequoia Marine Solutions'
          curl --fail --silent --show-error -o /dev/null -D - https://testing.voss.industries/ | grep -qi '^x-robots-tag: noindex'

  # Production = branch main. Promote by fast-forwarding main to a site-v2 commit that's green on testing:
  #   git push origin site-v2:main
  deploy-production:
    name: Deploy main to production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production   # add required reviewers in repo settings if you want a click-to-ship gate
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/prod-deploy"
          chmod 0600 "$HOME/.ssh/prod-deploy"
          install -m 0644 deploy/staging_known_hosts "$HOME/.ssh/known_hosts"
      - name: Deploy tested commit
        run: >-
          ssh -i "$HOME/.ssh/prod-deploy"
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          -o ConnectTimeout=15
          hermes_990-005@sms.avirobotics.org
          "deploy-site-prod $GITHUB_SHA"
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://sms.avirobotics.org/healthz
          curl --fail --silent --show-error https://sms.avirobotics.org/ | grep -q 'Sequoia Marine Solutions'
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://avirobotics.org/healthz
          curl --fail --silent --show-error https://avirobotics.org/shop | grep -q 'data-store="coming-soon"'
